<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị | DJ TOMK</title><link rel="stylesheet" href="/style.css"></head>
<body class="admin-body"><header class="topbar"><a class="brand" href="/"><span class="brand-mark">TK</span><span>DJ <b>TOMK</b><small>ADMIN STUDIO</small></span></a><nav><a href="/">← Về trang chủ</a></nav></header>
<main class="admin-main"><p class="eyebrow">CONTROL ROOM</p><h1>Quản trị <span>âm nhạc</span></h1><p class="muted">Đăng nhập để thêm hoặc xóa bài nhạc hiển thị trên website.</p>
<section id="login-panel" class="admin-panel"><h2>Đăng nhập quản trị</h2><form id="login-form"><label>Mật khẩu quản trị<input id="password" type="password" autocomplete="current-password" required placeholder="Nhập mật khẩu"></label><button class="primary-btn" type="submit">Đăng nhập ↗</button><p id="login-message" class="form-message"></p></form><p class="hint">Mật khẩu ban đầu nếu chưa cấu hình: <code>TOMK-change-me</code>. Hãy đổi thành mật khẩu riêng trong Environment của Render.</p></section>
<section id="dashboard" class="admin-panel hidden"><div class="section-head"><h2>Thêm bài nhạc</h2><button id="logout" class="secondary-btn">Đăng xuất</button></div><form id="track-form" class="admin-form"><label>Tên bài nhạc *<input id="title" required maxlength="160" placeholder="Ví dụ: Nonstop DJ TOMK Vol. 01"></label><label>Tên DJ / nghệ sĩ<input id="artist" value="DJ TOMK"></label><label>Thể loại<select id="track-genre"><option>VinaHouse</option><option>Nonstop</option><option>EDM</option><option>Remix</option></select></label><label>Đường dẫn file nhạc (MP3 URL) *<input id="audio-url" required type="url" placeholder="https://.../track.mp3"></label><label>Đường dẫn ảnh bìa (không bắt buộc)<input id="cover-url" type="url" placeholder="https://.../cover.jpg"></label><button class="primary-btn" type="submit">+ Thêm bài nhạc</button><p id="track-message" class="form-message"></p></form><h2 class="manage-heading">Danh sách bài nhạc</h2><div id="admin-track-list" class="admin-track-list"></div></section></main><script src="/admin.js"></script></body></html>
